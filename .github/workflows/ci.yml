name: Checks and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate build-only configuration
        run: npm run configure
        env:
          CONFIG_PILOT_KV_NAMESPACE_ID: "00000000000000000000000000000000"
      - run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_TO_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Generate personal deployment configuration
        run: npm run configure
        env:
          CONFIG_PILOT_KV_NAMESPACE_ID: ${{ secrets.CONFIG_PILOT_KV_NAMESPACE_ID }}
          CONFIG_PILOT_WORKER_NAME: ${{ vars.CONFIG_PILOT_WORKER_NAME }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - name: Deploy Worker and initial password Secret
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ADMIN_PASSWORD
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
